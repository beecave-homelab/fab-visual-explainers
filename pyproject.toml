[project]
name = "fab-html-visuals"
version = "0.1.0"
description = "Zelfstandige FAB HTML-prototypes met lokale kwaliteitscontroles"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
  "playwright==1.55.0",
  "pytest==8.4.2",
  "ruff>=0.13,<1",
  "mdformat>=0.7,<1",
  "mdformat-gfm>=0.4,<1",
  "mdformat-frontmatter>=2,<3",
  "djlint>=1.36,<2",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
addopts = "-ra --strict-config --strict-markers"
faulthandler_timeout = 30

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.djlint]
profile = "html"
indent = 2
max_line_length = 100
format_css = false
format_js = false
